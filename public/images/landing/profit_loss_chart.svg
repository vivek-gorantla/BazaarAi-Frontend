<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#eff6f2"/>
  
  <g transform="translate(180, 100)">
    <!-- Base Line -->
    <line x1="20" y1="350" x2="480" y2="350" stroke="#3b463f" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Bar 1 (Orange) -->
    <rect x="50" y="280" width="40" height="70" rx="8" fill="#e6a47a" stroke="#3b463f" stroke-width="3"/>
    <!-- To make only top rounded, draw a rect over the bottom -->
    <rect x="50" y="320" width="40" height="30" fill="#e6a47a" />
    <line x1="50" y1="320" x2="50" y2="350" stroke="#3b463f" stroke-width="3"/>
    <line x1="90" y1="320" x2="90" y2="350" stroke="#3b463f" stroke-width="3"/>
    <circle cx="70" cy="255" r="22" fill="#e6a47a" stroke="#3b463f" stroke-width="3"/>
    <text x="70" y="263" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3b463f" text-anchor="middle">&#8377;</text>

    <!-- Bar 2 (Green) -->
    <rect x="120" y="240" width="40" height="110" rx="8" fill="#84a187" stroke="#3b463f" stroke-width="3"/>
    <rect x="120" y="320" width="40" height="30" fill="#84a187" />
    <line x1="120" y1="320" x2="120" y2="350" stroke="#3b463f" stroke-width="3"/>
    <line x1="160" y1="320" x2="160" y2="350" stroke="#3b463f" stroke-width="3"/>
    <circle cx="140" cy="215" r="22" fill="#84a187" stroke="#3b463f" stroke-width="3"/>
    <text x="140" y="223" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3b463f" text-anchor="middle">&#8377;</text>

    <!-- Bar 3 (Orange) -->
    <rect x="190" y="180" width="40" height="170" rx="8" fill="#e6a47a" stroke="#3b463f" stroke-width="3"/>
    <rect x="190" y="320" width="40" height="30" fill="#e6a47a" />
    <line x1="190" y1="320" x2="190" y2="350" stroke="#3b463f" stroke-width="3"/>
    <line x1="230" y1="320" x2="230" y2="350" stroke="#3b463f" stroke-width="3"/>
    <circle cx="210" cy="155" r="22" fill="#e6a47a" stroke="#3b463f" stroke-width="3"/>
    <text x="210" y="163" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3b463f" text-anchor="middle">&#8377;</text>

    <!-- Bar 4 (Green) -->
    <rect x="260" y="110" width="40" height="240" rx="8" fill="#84a187" stroke="#3b463f" stroke-width="3"/>
    <rect x="260" y="320" width="40" height="30" fill="#84a187" />
    <line x1="260" y1="320" x2="260" y2="350" stroke="#3b463f" stroke-width="3"/>
    <line x1="300" y1="320" x2="300" y2="350" stroke="#3b463f" stroke-width="3"/>
    <circle cx="280" cy="85" r="22" fill="#84a187" stroke="#3b463f" stroke-width="3"/>
    <text x="280" y="93" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3b463f" text-anchor="middle">&#8377;</text>

    <!-- Bar 5 (Orange) -->
    <rect x="330" y="30" width="40" height="320" rx="8" fill="#e6a47a" stroke="#3b463f" stroke-width="3"/>
    <rect x="330" y="320" width="40" height="30" fill="#e6a47a" />
    <line x1="330" y1="320" x2="330" y2="350" stroke="#3b463f" stroke-width="3"/>
    <line x1="370" y1="320" x2="370" y2="350" stroke="#3b463f" stroke-width="3"/>
    <circle cx="350" cy="5" r="22" fill="#e6a47a" stroke="#3b463f" stroke-width="3"/>
    <text x="350" y="13" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3b463f" text-anchor="middle">&#8377;</text>

    <!-- Big Sweeping Arrow -->
    <path d="M 40 170 C 130 160, 210 110, 275 30 L 255 10 L 320 -10 L 305 60 L 285 45 C 220 120, 140 175, 45 185 Z" fill="#d2bb91" stroke="#3b463f" stroke-width="3" stroke-linejoin="round"/>

    <!-- Pill Label -->
    <rect x="110" y="390" width="220" height="50" rx="25" fill="#eff6f2" stroke="#3b463f" stroke-width="3"/>
    <text x="220" y="423" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3b463f" text-anchor="middle">PROFIT &amp; LOSS</text>
  </g>
</svg>