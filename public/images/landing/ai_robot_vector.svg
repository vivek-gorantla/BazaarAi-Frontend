<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="600" fill="#f4faf5"/>
    
    <!-- Base -->
    <path d="M 250 450 L 350 450 L 350 430 L 330 430 L 330 350 L 270 350 L 270 430 L 250 430 Z" fill="#93a896" stroke="#4b5563" stroke-width="3"/>
    <line x1="200" y1="450" x2="400" y2="450" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Lower Arm -->
    <rect x="270" y="220" width="60" height="150" rx="30" fill="#a3b8a6" stroke="#4b5563" stroke-width="3" transform="rotate(30 300 350)"/>
    <circle cx="300" cy="350" r="25" fill="#d1d5db" stroke="#4b5563" stroke-width="3"/>
    <circle cx="300" cy="350" r="10" fill="#4b5563"/>
    
    <!-- Upper Arm -->
    <rect x="260" y="100" width="40" height="160" rx="20" fill="#a3b8a6" stroke="#4b5563" stroke-width="3" transform="rotate(-50 280 230)"/>
    <circle cx="215" cy="205" r="25" fill="#d1d5db" stroke="#4b5563" stroke-width="3"/>
    <circle cx="215" cy="205" r="10" fill="#4b5563"/>
    
    <!-- Hand / Claw -->
    <circle cx="360" cy="110" r="20" fill="#fba973" stroke="#4b5563" stroke-width="3"/>
    <path d="M 360 130 L 340 180 L 360 180" fill="none" stroke="#fba973" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 340 180 L 360 180" stroke="#4b5563" stroke-width="3" fill="none"/>
    <path d="M 360 130 L 400 170 L 380 190" fill="none" stroke="#fba973" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Boxes -->
    <line x1="450" y1="350" x2="650" y2="350" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
    <rect x="520" y="270" width="60" height="80" fill="#b4c2b6" stroke="#4b5563" stroke-width="3"/>
    <path d="M 520 290 L 580 290" stroke="#4b5563" stroke-width="3"/>
    <path d="M 550 270 L 550 290" stroke="#4b5563" stroke-width="3"/>
    
    <!-- Box in Claw -->
    <rect x="370" y="180" width="60" height="70" fill="#b4c2b6" stroke="#4b5563" stroke-width="3" transform="rotate(15 400 215)"/>
    <path d="M 365 200 L 420 215" stroke="#4b5563" stroke-width="3"/>
    
    <!-- AI Chips -->
    <rect x="150" y="280" width="40" height="40" rx="5" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
    <text x="170" y="306" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">AI</text>
    <line x1="140" y1="290" x2="150" y2="290" stroke="#4b5563" stroke-width="2"/><line x1="140" y1="300" x2="150" y2="300" stroke="#4b5563" stroke-width="2"/><line x1="140" y1="310" x2="150" y2="310" stroke="#4b5563" stroke-width="2"/>
    <line x1="190" y1="290" x2="200" y2="290" stroke="#4b5563" stroke-width="2"/><line x1="190" y1="300" x2="200" y2="300" stroke="#4b5563" stroke-width="2"/><line x1="190" y1="310" x2="200" y2="310" stroke="#4b5563" stroke-width="2"/>
    
    <rect x="580" y="100" width="30" height="30" rx="4" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
    <text x="595" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="middle">AI</text>
    
  </svg>